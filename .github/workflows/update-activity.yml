name: Update engineering pulse

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-activity.mjs
      - scripts/update-activity.test.mjs
      - .github/workflows/update-activity.yml

permissions:
  contents: write

concurrency:
  group: engineering-pulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test collection and snapshot behavior
        run: node --test scripts/update-activity.test.mjs
      - name: Refresh public project activity
        run: node scripts/update-activity.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish changed snapshot
        run: |
          git add -- README.md assets/activity
          if git diff --cached --quiet; then
            echo 'Activity unchanged; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh engineering pulse snapshot'
          git push origin HEAD:main
